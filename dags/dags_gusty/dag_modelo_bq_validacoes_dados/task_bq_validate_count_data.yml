operator: airflow.providers.google.cloud.operators.bigquery.BigQueryValueCheckOperator
doc_md: |
  ## Validação de Contagem de Linhas.
  Verifica se a condição "a tabela tem mais de 10 linhas" é verdadeira.

gcp_conn_id: "google-cloud-default-abc-sbx-engenhariadados"
use_legacy_sql: false
location: "US"
sql: |
  SELECT COUNT(*) > 10
  FROM `abc-sbx-engenhariadados.DS_EXEMPLOS_TASK_COMPOSER.TR_DADOS_COMPOSER`
# A tarefa passará se o resultado da SQL for igual ao pass_value 
pass_value: False
trigger_rule: all_success

dependencies:
  - task_bq_validate_column